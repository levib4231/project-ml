name: NGPS CPU correctness

on:
  push:
    paths: ['NGPS/**', '.github/workflows/ngps-cpu.yml']
  pull_request:
    paths: ['NGPS/**', '.github/workflows/ngps-cpu.yml']
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: NGPS/requirements.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r NGPS/requirements.txt
      - run: python -m compileall -q NGPS
      - run: python NGPS/scripts/smoke_test.py
      - run: python -m unittest discover -s NGPS/tests -v
      - run: python NGPS/scripts/synthetic_pipeline.py --work-dir "$RUNNER_TEMP/ngps-synthetic"
      - run: git diff --check
