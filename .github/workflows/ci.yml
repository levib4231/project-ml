name: CPU checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e "NGPS[dev]"
      - name: Compile
        run: python -m compileall -q NGPS Data/Clean
      - name: Unit tests
        run: pytest -q
      - name: CPU smoke test
        run: python NGPS/scripts/smoke_test.py
