# Shared capacity and workload for the three objectives. Freeze after GPU pilot.
ngps:
  patch_size: 7
  search_window: 15
  topk: 4
  mask_threshold: 0.05
  rc_weight: 0.5
  nafnet_width: 16
  nafnet_enc_blocks: [1, 1, 1, 1]
  nafnet_middle_blocks: 1
  nafnet_dec_blocks: [1, 1, 1, 1]
training:
  epochs: 10
  batch_size: 1
  crop_size: 128
  lr: 0.0002
  weight_decay: 0.00001
  num_workers: 0
  seed: 42
